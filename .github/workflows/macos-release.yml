name: Build macOS 1.5.0 market update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-stable-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regressions
        run: npm run test:regression
      - name: Build DMG
        run: >-
          npm run build:renderer &&
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          --config.mac.artifactName='Niulai-${version}-mac-${arch}-20261112.${ext}'
          --config.dmg.artifactName='Niulai-${version}-mac-${arch}-20261112.${ext}'
      - name: Install launch-test dependencies
        run: npm ci --prefix niulai-android --ignore-scripts --no-audit --no-fund
      - name: Verify native application and all market-source flows
        env:
          NIULAI_QA_OUTPUT: outputs/us-market-fix/${{ matrix.arch }}/desktop
          NIULAI_SOURCE_QA_OUTPUT: outputs/us-market-fix/${{ matrix.arch }}/sources
        run: |
          if [ '${{ matrix.arch }}' = 'arm64' ]; then app_dir='mac-arm64'; else app_dir='mac'; fi
          export NIULAI_QA_EXECUTABLE="$PWD/release/$app_dir/牛来盯盘.app/Contents/MacOS/牛来盯盘"
          node scripts/verify-macos-release.mjs
          node scripts/verify-release-payload.cjs "$PWD/release/$app_dir/牛来盯盘.app/Contents/Resources/app.asar" "outputs/us-market-fix/${{ matrix.arch }}/payload-verification.json"
          node scripts/verify-market-sources.mjs
          node scripts/verify-desktop.mjs
      - name: Compute checksums
        run: |
          cd release
          shasum -a 256 Niulai-1.5.0-mac-${{ matrix.arch }}-20261112.dmg > Niulai-1.5.0-mac-${{ matrix.arch }}-20261112.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-1.5.0-${{ matrix.arch }}-20261112
          path: |
            release/*.dmg
            release/*.sha256
            outputs/macos-release/
            outputs/us-market-fix/
      - name: Upload verified packages to stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.5.0 release/Niulai-1.5.0-mac-${{ matrix.arch }}-20261112.dmg release/Niulai-1.5.0-mac-${{ matrix.arch }}-20261112.dmg.sha256
