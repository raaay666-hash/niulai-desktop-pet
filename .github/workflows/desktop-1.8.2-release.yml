name: Build and verify macOS 1.8.2 release packages
on:
  workflow_dispatch:
  push:
    branches: [codex/niulai-desktop-1.8.2]
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            native: arm64
          - runner: macos-15-intel
            arch: x64
            native: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix niulai-android --ignore-scripts --no-audit --no-fund
      - run: npm run test:regression && node scripts/test-updates.cjs
      - run: node scripts/test-orderbook.cjs
      - name: Build macOS disk image
        run: >-
          npm run build:renderer && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          --config.mac.artifactName='Niulai-${version}-mac-${arch}.${ext}'
          --config.dmg.artifactName='Niulai-${version}-mac-${arch}.${ext}'
      - name: Run the app delivered inside the disk image
        run: |
          mkdir "$RUNNER_TEMP/niulai-dmg" "$RUNNER_TEMP/niulai-app"
          hdiutil attach "release/Niulai-1.8.2-mac-${{ matrix.arch }}.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/niulai-dmg"
          ditto "$RUNNER_TEMP/niulai-dmg/牛来盯盘.app" "$RUNNER_TEMP/niulai-app/牛来盯盘.app"
          hdiutil detach "$RUNNER_TEMP/niulai-dmg"
          app="$RUNNER_TEMP/niulai-app/牛来盯盘.app/Contents"
          export NIULAI_QA_EXECUTABLE="$app/MacOS/牛来盯盘"
          test "$(uname -m)" = '${{ matrix.native }}'
          test "$(lipo -archs "$NIULAI_QA_EXECUTABLE")" = '${{ matrix.native }}'
          export NIULAI_SOURCE_QA_OUTPUT="$PWD/outputs/release-macos/sources"
          node scripts/verify-release-payload.cjs "$app/Resources/app.asar" outputs/release-macos/payload.json
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/desktop" node scripts/verify-desktop.mjs
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/experience" node scripts/test-desktop-experience.mjs
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/charts" node scripts/test-market-chart.mjs --desktop-only
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/insights" node scripts/test-market-insights.mjs
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/feedback" node scripts/test-feedback.mjs --desktop-only
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/update" node scripts/test-update-ui.mjs
          export NIULAI_QA_PLUGIN_MANIFEST="$PWD/plugins/niulai-orderbook.niulai-plugin.json"
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/orderbook" node scripts/test-orderbook-desktop.mjs
          node scripts/verify-market-sources.mjs
          NIULAI_QA_OUTPUT="$PWD/outputs/release-macos/desktop" node scripts/test-single-instance.cjs
      - name: Checksums
        run: cd release && shasum -a 256 Niulai-1.8.2-mac-${{ matrix.arch }}.dmg > Niulai-1.8.2-mac-${{ matrix.arch }}.dmg.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niulai-1.8.2-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.sha256
            outputs/release-macos/
